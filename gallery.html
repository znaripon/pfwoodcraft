<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Pottery Fields Woodcraft</title>
    <meta name="description" content="Project gallery showing carpentry and joinery work by Pottery Fields Woodcraft.">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

  <div class="logo">
    <a href="index.html">
        <img src="images/pflogo.png"
             alt="Pottery Fields Woodcraft"
             class="logo-image">
    </a>
</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="gallery.html">Project Gallery</a>
        <a href="kitchens.html">Kitchens</a>
        <a href="reviews.html">Reviews</a>
        <a href="contact.html">Contact</a>
    </nav>

</header>

<main class="gallery-page">

    <section class="gallery-intro">
         <p>A small selection of recent woodworking and joinery projects.</p>
    </section>

   <section class="photo-gallery">

    <div class="gallery-stage">

        <button
            type="button"
            id="previousPhoto"
            class="gallery-arrow"
            aria-label="Previous photograph">
            &#10094;
        </button>

        <div class="photo-stack" id="photoStack">

            <figure class="photo-card photo-card-back">
                <img id="backImage" src="images/gallery/gp3.jpeg" alt="">
            </figure>

            <figure class="photo-card photo-card-middle">
                <img id="middleImage" src="images/gallery/gp2.jpeg" alt="">
            </figure>

            <figure class="photo-card photo-card-front">
                <img id="frontImage" src="images/gallery/gp1.jpeg" alt="">
                <figcaption id="photoCaption"></figcaption>
            </figure>

        </div>

        <button
            type="button"
            id="nextPhoto"
            class="gallery-arrow"
            aria-label="Next photograph">
            &#10095;
        </button>

    </div>

    <span id="photoCounter">1 of 23</span>

</section>
  


</main>
<script src="gallery.js"></script>
</body>
</html>
